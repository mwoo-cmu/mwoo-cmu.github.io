<!DOCTYPE html>
<html lang="en-US" class="h-full bg-slate-950 text-slate-100">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="./style.css" rel="stylesheet">
    <title>Gameplay Helper - Solo Shatterpoint</title>
    <style>
        /* Custom scrollbars for dashboard panels */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
        }

        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }
    </style>
</head>

<body class="h-full flex flex-col font-sans antialiased overflow-hidden">
    <script type="text/javascript" src="util.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
    <datalist id="unitDatalist"></datalist>
    <datalist id="enemyDatalist"></datalist>

    <!-- Main Dashboard Layout -->
    <main class="grid grid-cols-1 md:grid-cols-12 gap-4 h-full p-4 overflow-hidden">

        <!-- LEFT PANEL: Player Section -->
        <section
            class="md:col-span-4 bg-slate-900/80 border border-slate-800 rounded-xl p-4 flex flex-col h-full overflow-hidden shadow-lg backdrop-blur-sm">
            <div id="playerOverview" class="flex-1 overflow-y-auto pr-1 space-y-4">
                <div class="border-b border-slate-800 pb-3 flex justify-between items-center">
                    <h2 id="playerFaction" class="text-2xl font-bold tracking-tight text-amber-400">Player</h2>
                    <div
                        class="flex items-center space-x-2 bg-slate-800/80 px-3 py-1.5 rounded-lg border border-slate-700">
                        <span style="font-family: shatterpoint_icons;" class="text-amber-400 text-lg">v</span>
                        <input type="number" id="forceCount" name="force"
                            class="w-12 bg-slate-950 border border-slate-700 rounded px-2 py-0.5 text-center font-mono focus:ring-1 focus:ring-amber-400 focus:outline-none">
                        <span class="text-slate-500">/</span>
                        <span id="forceMax" class="font-mono text-slate-300"></span>
                    </div>
                </div>

                <div class="bg-slate-950/50 rounded-lg p-3 border border-slate-800 space-y-2">
                    <div class="flex items-center gap-2">
                        <button type="button" onclick="drawOrderCard()"
                            class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold rounded-md transition shadow-sm">Draw
                            Order Card</button>
                        <span id="orderCur" class="font-semibold text-slate-200"></span>
                    </div>
                    <div class="flex items-center gap-2 pt-1 border-t border-slate-800/60">
                        <button type="button" onclick="reserveOrderCard()"
                            class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold rounded-md transition border border-slate-700">Reserve
                            Order Card</button>
                        <span id="orderReserve" class="font-semibold text-slate-300"></span>
                        <button type="button" onclick="playReservedOrderCard()" id="playReserveButton"
                            class="hidden px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold rounded-md transition">Play
                            Reserved</button>
                    </div>
                </div>

                <div id="playerUnits" class="space-y-2"></div>
                <hr class="border-slate-800">
                <div id="addlPlayer" class="space-y-2"></div>

                <div class="flex gap-2 pt-2">
                    <input type="text" id="addUnit" list="unitDatalist" placeholder="Player Unit"
                        class="flex-1 bg-slate-950 border border-slate-700 rounded-md px-3 py-1.5 text-sm focus:outline-none focus:border-indigo-500 placeholder-slate-500">
                    <button type="button" onclick="addPlayerUnit()"
                        class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold rounded-md transition whitespace-nowrap">Add
                        Unit</button>
                </div>
            </div>
        </section>

        <!-- MIDDLE PANEL: Missions & Game Events -->
        <section
            class="md:col-span-4 bg-slate-900/80 border border-slate-800 rounded-xl p-4 flex flex-col h-full overflow-hidden shadow-lg backdrop-blur-sm">
            <div class="flex-1 overflow-y-auto pr-1 space-y-4">
                <div class="border-b border-slate-800 pb-3">
                    <h2 class="text-2xl font-bold tracking-tight text-indigo-400">Missions</h2>
                    <div id="missions" class="mt-2 space-y-2"></div>
                </div>

                <!-- Navigation Controls -->
                <div
                    class="flex justify-center items-center gap-2 bg-slate-950 p-1.5 rounded-lg border border-slate-800 text-xs font-medium text-slate-400">
                    <label for="location"
                        class="cursor-pointer px-3 py-1 rounded-md transition has-[:checked]:bg-slate-800 has-[:checked]:text-indigo-400">
                        <input type="radio" id="location" name="rightPane" checked class="hidden">
                        <span id="locationLabel">Location</span>
                    </label>
                    <label for="enemies"
                        class="cursor-pointer px-3 py-1 rounded-md transition has-[:checked]:bg-slate-800 has-[:checked]:text-indigo-400">
                        <input type="radio" id="enemies" name="rightPane" class="hidden">
                        <span id="enemiesLabel">Enemies</span>
                    </label>
                    <label for="combat"
                        class="cursor-pointer px-3 py-1 rounded-md transition has-[:checked]:bg-slate-800 has-[:checked]:text-indigo-400">
                        <input type="radio" id="combat" name="rightPane" class="hidden">
                        <span>Combat</span>
                    </label>
                </div>

                <!-- Location Pane -->
                <div id="locationInfo" class="space-y-4">
                    <button type="button" onclick="drawEventCard()"
                        class="w-full py-2 bg-slate-800 hover:bg-slate-700 text-indigo-300 text-xs font-semibold rounded-md transition border border-slate-700">Draw
                        Event Card</button>
                    <div id="eventCards" class="space-y-2"></div>
                    <div id="gameSetup" class="text-sm"></div>
                    <h3 class="text-lg font-semibold text-slate-300 border-b border-slate-800 pb-1">Room-Specific
                        Abilities</h3>
                    <div id="roomAbilities" class="space-y-2 text-sm"></div>
                </div>

                <!-- Enemy Info Pane -->
                <div id="enemyInfo" class="hidden space-y-3">
                    <div class="flex items-center gap-2 bg-slate-950 p-2 rounded-md border border-slate-800">
                        <button type="button" onclick="drawEnemyOrderCard()"
                            class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-xs font-semibold rounded-md border border-slate-700">Draw
                            Order Card</button>
                        <span id="enemyOrderCur" class="font-semibold text-rose-400"></span>
                    </div>
                    <div class="flex flex-wrap gap-2">
                        <button type="button" onclick="drawEnemyCard()"
                            class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-xs font-semibold rounded-md border border-slate-700">Draw
                            <span style="font-family: shatterpoint_icons">j</span> Card</button>
                        <button type="button" onclick="drawWoundCard()"
                            class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-xs font-semibold rounded-md border border-slate-700">Draw
                            <span style="font-family: shatterpoint_icons">i</span> Card</button>
                        <button type="button" onclick="clearEnemyCards()"
                            class="px-3 py-1.5 bg-rose-950/50 hover:bg-rose-900/50 text-rose-300 text-xs font-semibold rounded-md border border-rose-800 transition ml-auto">Clear
                            Drawn Cards</button>
                    </div>
                    <div id="enemyCards" class="space-y-2"></div>
                </div>

                <!-- Combat Pane -->
                <div id="combatInfo" class="hidden space-y-4 bg-slate-950/60 p-4 rounded-lg border border-slate-800">
                    <div class="flex justify-around items-center gap-4">
                        <div class="flex items-center gap-2">
                            <label for="attackCount"
                                class="text-xs font-bold text-rose-400 uppercase tracking-wider">Attack</label>
                            <input type="number" id="attackCount" name="attack"
                                class="w-14 bg-slate-900 border border-slate-700 rounded px-2 py-1 text-center font-mono focus:outline-none focus:border-rose-500">
                        </div>
                        <div class="flex items-center gap-2">
                            <label for="defenceCount"
                                class="text-xs font-bold text-sky-400 uppercase tracking-wider">Defence</label>
                            <input type="number" id="defenceCount" name="defence"
                                class="w-14 bg-slate-900 border border-slate-700 rounded px-2 py-1 text-center font-mono focus:outline-none focus:border-sky-500">
                        </div>
                    </div>
                    <button type="button" onclick="rollDice()"
                        class="w-full py-2 bg-gradient-to-r from-rose-600 to-indigo-600 hover:from-rose-500 hover:to-indigo-500 text-white font-bold rounded-md shadow transition text-xs tracking-wider uppercase">Roll
                        Dice</button>
                    <div id="rollResults"
                        class="bg-slate-950 p-3 rounded border border-slate-800 text-sm font-mono leading-relaxed">
                    </div>
                    <div id="diceTrayContainer"
                        class="fixed bottom-4 right-4 w-80 h-64 bg-slate-900/90 border border-slate-800 rounded-xl shadow-2xl overflow-hidden hidden flex-col z-50">
                        <div class="flex justify-between items-center px-3 py-2 border-b border-slate-800 bg-slate-950">
                            <span class="text-xs font-bold text-amber-400">3D Dice Tray</span>
                            <button onclick="closeDiceTray()"
                                class="text-slate-400 hover:text-white text-xs font-bold">✕</button>
                        </div>
                        <div id="diceCanvasHolder" class="w-full h-full relative"></div>
                    </div>
                </div>
            </div>
        </section>

        <!-- RIGHT PANEL: Enemy Section -->
        <section
            class="md:col-span-4 bg-slate-900/80 border border-slate-800 rounded-xl p-4 flex flex-col h-full overflow-hidden shadow-lg backdrop-blur-sm">
            <div class="flex-1 overflow-y-auto pr-1 space-y-4">
                <div class="border-b border-slate-800 pb-3">
                    <h2 id="enemyFaction" class="text-2xl font-bold tracking-tight text-rose-500">Enemy</h2>
                </div>
                <div id="enemyOverview" class="space-y-2"></div>
                <hr class="border-slate-800">
                <div id="addlEnemies" class="space-y-2"></div>

                <div class="flex gap-2 pt-2">
                    <input type="text" id="addEnemy" list="enemyDatalist" placeholder="Enemy Unit"
                        class="flex-1 bg-slate-950 border border-slate-700 rounded-md px-3 py-1.5 text-sm focus:outline-none focus:border-rose-500 placeholder-slate-500">
                    <button type="button" onclick="addEnemyUnit()"
                        class="px-3 py-1.5 bg-rose-600 hover:bg-rose-500 text-white text-xs font-semibold rounded-md transition whitespace-nowrap">Add
                        Enemy</button>
                </div>
            </div>
        </section>

    </main>

    <script>
        const urlParams = new URLSearchParams(window.location.search);

        const RIGHT_PANE = ["locationInfo", "enemyInfo", "combatInfo"];
        document.getElementById("location").addEventListener('change', function () { lazySwap("locationInfo", RIGHT_PANE) });
        document.getElementById("enemies").addEventListener('change', function () { lazySwap("enemyInfo", RIGHT_PANE) });
        document.getElementById("combat").addEventListener('change', function () { lazySwap("combatInfo", RIGHT_PANE) });

        const ATTACK_RAW = ['b', 'a', 'a', 'a', 'c', 'c', 'd', 'd'];
        const ATTACK = ATTACK_RAW.map((face) => addTextIcons('{' + face + '}'));
        const DEFENCE_RAW = ['e', 'e', 'f', 'd', 'd'];
        const DEFENCE = DEFENCE_RAW.map((face) => addTextIcons('{' + face + '}'));
        function rollDice() {
            var attack = {};
            attack[ATTACK[0]] = 0;
            attack[ATTACK[1]] = 0;
            attack[ATTACK[4]] = 0;
            attack[ATTACK[6]] = 0;
            var attackResults = [];
            for (var i = 0; i < document.getElementById("attackCount").value; i++) {
                const idx = Math.floor(Math.random() * ATTACK.length);
                attack[ATTACK[idx]] += 1;
                attackResults.push(ATTACK_RAW[idx]);
            }
            var defence = {};
            defence[DEFENCE[0]] = 0;
            defence[DEFENCE[2]] = 0;
            defence[DEFENCE[4]] = 0;
            var defenceResults = [];
            for (var i = 0; i < document.getElementById("defenceCount").value; i++) {
                const idx = Math.floor(Math.random() * DEFENCE.length);
                defence[DEFENCE[idx]] += 1;
                defenceResults.push(DEFENCE_RAW[idx]);
            }
            rollDice3D(attackResults, defenceResults);
            function formatPair(pair) {
                return `<input style="width: 50px" class="bg-slate-900 border border-slate-700 rounded px-1 py-0.5 text-center text-slate-100" type="number" value="${pair[1]}"/>&nbsp;${pair[0]}`;
            }
            var out = `<span class="text-rose-400 font-bold">Attack:</span><br>${Object.entries(attack).map((pair) => formatPair(pair)).join(", ")}<br><br><span class="text-sky-400 font-bold">Defence:</span><br>${Object.entries(defence).map((pair) => formatPair(pair)).join(", ")}`;
            document.getElementById("rollResults").innerHTML = out;
        }

        var ENEMY_POOL = {};
        var enemyDeck = {};
        var enemyDiscard = {};
        var enemyShownI = 0;
        var enemyOrderInPlay = [];
        var addlEnemyI = 0;
        var woundDeck = [];
        var woundPool = [];

        var EVENT_POOL;
        var eventDeck = [];
        var eventDiscard = [];
        var gameLocation;

        var orderDeck = [];
        var orderInPlay = [];
        var maxForce = 0;
        var playerFaction = urlParams.get("faction");
        var enemyFaction = urlParams.get("enemyFaction");
        var addlPlayerI = 0;
        var addlPlayerOrder = {};

        (function () {
            document.getElementById("playerFaction").innerText = playerFaction;
            var loc = urlParams.get("location");
            if (loc) {
                document.getElementById("locationLabel").innerText = loc;
                withLocations((LOCATIONS) => {
                    gameLocation = LOCATIONS[loc];
                    eventDeck = gameLocation["events"]["deck"];
                    EVENT_POOL = gameLocation["events"]["pool"];
                    var factionEvents = gameLocation["factions"][playerFaction]["events"];
                    eventDeck.push(...factionEvents["deck"].map((idx) => idx + EVENT_POOL.length));
                    EVENT_POOL.push(...factionEvents["pool"]);

                    document.getElementById("roomAbilities").innerHTML = renderLocationAbilities(gameLocation["rooms"]);

                    var missionCount = urlParams.get("missions");
                    var locationMissions = gameLocation["factions"][playerFaction]["missions"];

                    var factionList = Object.keys(gameLocation["factions"]);
                    if (factionList.length == 2) {
                        enemyFaction = factionList[factionList.indexOf(playerFaction) === 0 ? 1 : 0];
                    } else {
                        enemyFaction = urlParams.get("enemyFaction");
                    }
                    document.getElementById("enemiesLabel").innerText = enemyFaction;
                    if (factionList.includes(enemyFaction)) {
                        var enemyEvents = gameLocation["factions"][enemyFaction]["enemyEvents"];
                        eventDeck.push(...enemyEvents["deck"].map((idx) => idx + EVENT_POOL.length));
                        EVENT_POOL.push(...enemyEvents["pool"]);
                        locationMissions.push(...gameLocation["factions"][enemyFaction]["enemyMissions"]);
                    }
                    document.getElementById("enemyFaction").innerText = enemyFaction;

                    // roll missions
                    drawMissions(locationMissions, missionCount);

                    document.getElementById("gameSetup").innerHTML = generateSetup(gameLocation);
                })
            }
            withEnemies((ENEMIES) => {
                var enemy = urlParams.get("enemies");
                if (enemy) {
                    document.getElementById("enemyOverview").innerHTML = renderEnemy(enemy, false, urlParams.get("difficulty"));
                    enemyDeck[enemy] = ENEMIES[enemy]["deck"]["cards"];
                    ENEMY_POOL[enemy] = ENEMIES[enemy]["deck"]["pool"];
                    enemyDiscard[enemy] = [];
                    woundDeck = ENEMIES[enemy]["wounded"]["cards"];
                    woundPool = ENEMIES[enemy]["wounded"]["pool"];
                    document.getElementById("enemyOrderCur").innerHTML = enemy;
                }
                document.getElementById("enemyDatalist").innerHTML = Object.keys(ENEMIES).map((key) => `<option value="${key}"></option>`).join("");
            });
            withUnits((UNITS) => {
                document.getElementById("unitDatalist").innerHTML = Object.keys(UNITS).map((key) => `<option value="${key}"></option>`).join("");
                var overview = '';
                var p = urlParams.get("p");
                if (p) {
                    overview += dropdownUnit(UNITS[p], true);
                    orderDeck.push(getOrderCard(UNITS[p], true));
                }
                var se = urlParams.get("se");
                if (se) {
                    overview += dropdownUnit(UNITS[se], false);
                    orderDeck.push(getOrderCard(UNITS[se], false));
                }
                var su = urlParams.get("su");
                if (su) {
                    overview += dropdownUnit(UNITS[su], false);
                    orderDeck.push(getOrderCard(UNITS[su], false));
                }
                var p2 = urlParams.get("p2");
                if (p2) {
                    overview += dropdownUnit(UNITS[p2], true);
                    orderDeck.push(getOrderCard(UNITS[p2], true));
                }
                var se2 = urlParams.get("se2");
                if (se2) {
                    overview += dropdownUnit(UNITS[se2], false);
                    orderDeck.push(getOrderCard(UNITS[se2], false));
                }
                var su2 = urlParams.get("su2");
                if (su2) {
                    overview += dropdownUnit(UNITS[su2], false);
                    orderDeck.push(getOrderCard(UNITS[su2], false));
                }
                orderDeck.push("Shatterpoint");
                document.getElementById("playerUnits").innerHTML = overview;
            });
            var forceCount = urlParams.get("force");
            if (forceCount) {
                maxForce = forceCount;
                document.getElementById("forceMax").innerText = forceCount;
                document.getElementById("forceCount").value = forceCount;
            }
        })()

        function drawEnemyCard() {
            var enemy = document.getElementById("enemyOrderCur").innerText;
            if (enemyDeck[enemy].length === 0) {
                enemyDeck[enemy] = [...enemyDiscard[enemy]];
            }
            var idx = Math.floor(Math.random() * enemyDeck[enemy].length);
            var pool_idx = enemyDeck[enemy][idx];
            var enemyCardDiv = document.getElementById("enemyCards");
            var tag = "enemyCard" + enemyShownI++;
            enemyCardDiv.innerHTML = `<div id="${tag}" class="bg-slate-950 p-3 rounded-md border border-slate-800 relative">${renderEnemyCard(ENEMY_POOL[enemy][pool_idx])}<button type="button" onclick="removeEnemyCard('${tag}')" class="mt-2 text-xs bg-rose-900/40 hover:bg-rose-900 text-rose-200 px-2 py-1 rounded border border-rose-800">Remove</button></div><br>${enemyCardDiv.innerHTML}`;
            enemyDiscard[enemy].push(pool_idx);
            enemyDeck[enemy].splice(idx, 1);
        }

        function drawWoundCard() {
            var idx = Math.floor(Math.random() * woundDeck.length);
            var poolIdx = woundDeck[idx];
            var enemyCardDiv = document.getElementById("enemyCards");
            var tag = "enemyCard" + enemyShownI++;
            var card = woundPool[poolIdx];
            var cardText = addTextIcons(`<h4 class="font-bold text-rose-400 mb-1">{i} ${card["name"]}</h4><p class="text-xs text-slate-300">${card["desc"]}</p>`);
            enemyCardDiv.innerHTML = `<div id="${tag}" class="bg-slate-950 p-3 rounded-md border border-rose-900/60">${cardText}<button type="button" onclick="removeEnemyCard('${tag}')" class="mt-2 text-xs bg-rose-900/40 hover:bg-rose-900 text-rose-200 px-2 py-1 rounded border border-rose-800">Remove</button></div><br>${enemyCardDiv.innerHTML}`;
            woundDeck.splice(idx, 1);
        }

        function removeEnemyCard(tag) {
            document.getElementById(tag).remove();
        }

        function clearEnemyCards() {
            document.getElementById("enemyCards").innerHTML = '';
        }

        function drawEventCard() {
            if (eventDeck.length === 0)
                eventDeck = [...eventDiscard];
            var idx = Math.floor(Math.random() * eventDeck.length);
            var pool_idx = eventDeck[idx];
            var eventCardDiv = document.getElementById("eventCards");
            eventCardDiv.innerHTML = renderEventCard(EVENT_POOL[pool_idx], gameLocation) + "<br>" + eventCardDiv.innerHTML;
            eventDiscard.push(pool_idx);
            eventDeck.splice(idx, 1);
        }

        function drawEnemyOrderCard() {
            if (enemyOrderInPlay.length === 0) {
                enemyOrderInPlay = [...Object.keys(enemyDeck)];
            }
            var idx = Math.floor(Math.random() * enemyOrderInPlay.length);
            document.getElementById("enemyOrderCur").innerHTML = enemyOrderInPlay[idx];
            enemyOrderInPlay.splice(idx, 1);
        }

        function drawOrderCard() {
            if (orderInPlay.length === 0) {
                var orderReserve = document.getElementById("orderReserve");
                if (orderReserve.innerHTML) {
                    document.getElementById("orderCur").innerHTML = orderReserve.innerHTML;
                    orderReserve.innerHTML = '';
                    return;
                }
                orderInPlay = [...orderDeck];
                document.getElementById("forceCount").value = maxForce;
            }
            var idx = Math.floor(Math.random() * orderInPlay.length);
            document.getElementById("orderCur").innerHTML = orderInPlay[idx];
            orderInPlay.splice(idx, 1);
        }

        function reserveOrderCard() {
            var orderCur = document.getElementById("orderCur");
            if (!(orderCur.innerHTML))
                return;
            var forceCount = document.getElementById("forceCount");
            if (forceCount.value === 0)
                return;
            forceCount.value -= 1;
            if (orderCur.innerHTML === 'Shatterpoint') {
                if (orderInPlay.length === 0) {
                    forceCount.value = parseInt(forceCount.value) + 1;
                    return;
                }
                drawOrderCard();
                orderInPlay.push("Shatterpoint");
                return;
            }
            var orderReserve = document.getElementById("orderReserve");
            var tmp = orderReserve.innerHTML;
            orderReserve.innerHTML = orderCur.innerHTML;
            orderCur.innerHTML = tmp;
            document.getElementById("playReserveButton").style.display = "inline-flex";
        }

        function playReservedOrderCard() {
            var orderReserve = document.getElementById("orderReserve");
            document.getElementById("orderCur").innerHTML = orderReserve.innerHTML;
            orderReserve.innerHTML = '';
            document.getElementById("playReserveButton").style.display = "none";
        }

        function drawMissions(missionList, count) {
            var workingList = [...missionList];
            var count = Math.min(count, workingList.length);
            var missions = "";
            for (var i = 0; i < count; i++) {
                missions += renderMission(workingList.splice(Math.floor(Math.random() * workingList.length), 1)[0]) + "<br>";
            }
            document.getElementById("missions").innerHTML = missions;
        }

        function addPlayerUnit() {
            var unit = document.getElementById("addUnit").value;
            var tag = "addlUnit" + addlPlayerI++;
            document.getElementById("addlPlayer").insertAdjacentHTML('beforeend', `<div id="${tag}">${dropdownUnit(UNITS[unit], false, tag, tag)}</div>`);
            var orderCard = getOrderCard(UNITS[unit], false);
            addlPlayerOrder[tag] = orderCard;
            orderDeck.push(orderCard);
        }

        function removePlayerUnit(tag) {
            document.getElementById(tag).remove();
            if (addlPlayerOrder.hasOwnProperty(tag)) {
                var orderCard = addlPlayerOrder[tag];
                var idx = orderDeck.indexOf(orderCard);
                if (idx > -1)
                    orderDeck.splice(idx, 1);
                idx = orderInPlay.indexOf(orderCard);
                if (idx > -1)
                    orderInPlay.splice(idx, 1);
                var orderReserve = document.getElementById("orderReserve");
                if (orderReserve.innerHTML === orderCard)
                    orderReserve.innerHTML = '';
            }
        }

        function addEnemyUnit() {
            var enemy = document.getElementById("addEnemy").value;
            if (Object.keys(enemyDeck).includes(enemy)) {
                return;
            }
            var tag = "addlEnemy" + addlEnemyI++;
            document.getElementById("addlEnemies").insertAdjacentHTML('beforeend', `<div id="${tag}">${renderEnemy(enemy, false, urlParams.get("difficulty"), tag, tag)}</div>`);

            var deck = ENEMIES[enemy]["deck"];
            if (deck["cards"].length !== 0) {
                enemyDeck[enemy] = deck["cards"];
                ENEMY_POOL[enemy] = deck["pool"];
                enemyDiscard[enemy] = [];
            }
        }

        function removeEnemyUnit(tag) {
            var enemyHtml = document.getElementById(tag);
            var enemy = enemyHtml.firstChild.innerText;
            delete enemyDeck[enemy];
            delete enemyDiscard[enemy];
            delete ENEMY_POOL[enemy];
            enemyHtml.remove();
        }
    </script>

    <script>
        let scene, camera, renderer, world;
        let diceBodies = [], diceMeshes = [];
        let isInitialized = false;

        // Generates dynamic canvas texture using shatterpoint_icons font
        function createIconTexture(iconChar, bgColor, fgColor) {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');

            // Background Face
            ctx.fillStyle = bgColor;
            ctx.fillRect(0, 0, 256, 256);

            // Outer Border
            ctx.strokeStyle = '#334155';
            ctx.lineWidth = 12;
            ctx.strokeRect(6, 6, 244, 244);

            // Icon Glyph
            ctx.fillStyle = fgColor;
            ctx.font = '130px shatterpoint_icons';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(iconChar, 128, 128);

            return new THREE.CanvasTexture(canvas);
        }

        function init3DDiceTray() {
            const container = document.getElementById('diceCanvasHolder');
            const width = container.clientWidth;
            const height = container.clientHeight;

            // Three.js Scene Setup
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x020617);

            camera = new THREE.PerspectiveCamera(40, width / height, 0.1, 100);
            camera.position.set(0, 11, 0);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(width, height);
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
            dirLight.position.set(4, 15, 4);
            dirLight.castShadow = true;
            scene.add(dirLight);

            // Physics World
            world = new CANNON.World();
            world.gravity.set(0, -25, 0);

            // Contact Physics (Friction and Bounciness)
            const wallMaterial = new CANNON.Material();
            const diceMaterial = new CANNON.Material();
            const contactMaterial = new CANNON.ContactMaterial(wallMaterial, diceMaterial, {
                friction: 0.6,
                restitution: 0.2
            });
            world.addContactMaterial(contactMaterial);

            // Floor Body
            const floorBody = new CANNON.Body({ mass: 0, material: wallMaterial, shape: new CANNON.Plane() });
            floorBody.quaternion.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), -Math.PI / 2);
            world.addBody(floorBody);

            // Bounding Tray Walls (Keeps dice strictly inside the tray)
            const wallX = 3.8, wallZ = 2.8;
            const addWall = (x, z, rotY) => {
                const wallBody = new CANNON.Body({ mass: 0, material: wallMaterial, shape: new CANNON.Plane() });
                wallBody.position.set(x, 0, z);
                wallBody.quaternion.setFromAxisAngle(new CANNON.Vec3(0, 1, 0), rotY);
                world.addBody(wallBody);
            };

            addWall(0, -wallZ, 0);          // Top Wall
            addWall(0, wallZ, Math.PI);     // Bottom Wall
            addWall(-wallX, 0, Math.PI / 2);// Left Wall
            addWall(wallX, 0, -Math.PI / 2);// Right Wall

            isInitialized = true;
            animate3D();
        }

        // Helper to fix UV coordinates so textures map directly onto flat triangular faces
        function applyD8FaceUVs(geometry) {
            const posAttr = geometry.attributes.position;
            const uvAttr = geometry.attributes.uv;

            // Each triangle face gets clean 2D mapping (bottom-left, bottom-right, top-center)
            for (let i = 0; i < posAttr.count; i += 3) {
                uvAttr.setXY(i, 0.1, 0.1);
                uvAttr.setXY(i + 1, 0.9, 0.1);
                uvAttr.setXY(i + 2, 0.5, 0.9);
            }
            uvAttr.needsUpdate = true;
        }

        // Spawn Attack Die (d8 - Octahedron)
        function spawnD8(targetIcon) {
            const radius = 0.85;
            const geometry = new THREE.OctahedronGeometry(radius);

            // 1. Re-map UVs so shatterpoint_icons sit squarely in the center of each triangular face
            applyD8FaceUVs(geometry);

            // 2. Orient geometry so a flat face points upward by default when resting
            geometry.rotateX(Math.atan(Math.SQRT2));

            const texture = createIconTexture(targetIcon, '#881337', '#fecdd3');
            const material = new THREE.MeshStandardMaterial({
                map: texture,
                roughness: 0.3,
                flatShading: true
            });

            const mesh = new THREE.Mesh(geometry, material);
            mesh.castShadow = true;
            scene.add(mesh);

            // 3. Build a true 8-sided ConvexPolyhedron physics body
            // Exact vertex positions of a unit octahedron rotated by Math.atan(Math.SQRT2)
            const vertices = [
                new CANNON.Vec3(0, radius, 0),
                new CANNON.Vec3(-radius, 0, 0),
                new CANNON.Vec3(0, 0, -radius),
                new CANNON.Vec3(radius, 0, 0),
                new CANNON.Vec3(0, 0, radius),
                new CANNON.Vec3(0, -radius, 0)
            ];

            // Define the 8 triangular faces (vertex indices)
            const faces = [
                [0, 1, 2], [0, 2, 3], [0, 3, 4], [0, 4, 1], // Top 4 faces
                [5, 2, 1], [5, 3, 2], [5, 4, 3], [5, 1, 4]  // Bottom 4 faces
            ];

            const shape = new CANNON.ConvexPolyhedron(vertices, faces);

            // Apply the same rotation to the physics shape as the mesh
            const q = new CANNON.Quaternion();
            q.setFromAxisAngle(new CANNON.Vec3(1, 0, 0), Math.atan(Math.SQRT2));
            shape.transformAllPoints(new CANNON.Vec3(0, 0, 0), q);

            const body = new CANNON.Body({ mass: 1.2, shape: shape });
            body.linearDamping = 0.4;
            body.angularDamping = 0.6; // High angular damping forces it to quickly rest flat on a face

            // Initial toss parameters
            body.position.set((Math.random() - 0.5) * 2, 4 + Math.random() * 2, (Math.random() - 0.5) * 2);
            body.velocity.set((Math.random() - 0.5) * 4, -4, (Math.random() - 0.5) * 4);
            body.angularVelocity.set(Math.random() * 12, Math.random() * 12, Math.random() * 12);

            world.addBody(body);
            diceBodies.push(body);
            diceMeshes.push(mesh);
        }

        // Spawn Defence Die (d6 - Cube)
        function spawnD6(targetIcon) {
            const size = 1.1;
            const geometry = new THREE.BoxGeometry(size, size, size);

            // 6 Cube Face Materials
            const texture = createIconTexture(targetIcon, '#1e1b4b', '#e0e7ff');
            const materials = Array(6).fill(new THREE.MeshStandardMaterial({ map: texture, roughness: 0.3 }));

            const mesh = new THREE.Mesh(geometry, materials);
            mesh.castShadow = true;
            scene.add(mesh);

            const shape = new CANNON.Box(new CANNON.Vec3(size / 2, size / 2, size / 2));
            const body = new CANNON.Body({ mass: 1.0, shape: shape });

            body.linearDamping = 0.3;
            body.angularDamping = 0.4;

            body.position.set((Math.random() - 0.5) * 2, 4 + Math.random() * 2, (Math.random() - 0.5) * 2);
            body.velocity.set((Math.random() - 0.5) * 4, -4, (Math.random() - 0.5) * 4);
            body.angularVelocity.set(Math.random() * 12, Math.random() * 12, Math.random() * 12);

            world.addBody(body);
            diceBodies.push(body);
            diceMeshes.push(mesh);
        }

        function rollDice3D(attackIcons = [], defenceIcons = []) {
            document.getElementById('diceTrayContainer').classList.remove('hidden');
            document.getElementById('diceTrayContainer').classList.add('flex');

            if (!isInitialized) init3DDiceTray();

            // Clear previous roll items
            diceBodies.forEach(b => world.remove(b));
            diceMeshes.forEach(m => scene.remove(m));
            diceBodies = [];
            diceMeshes = [];

            // Spawn Attack Dice (Red d8)
            attackIcons.forEach(icon => spawnD8(icon));

            // Spawn Defence Dice (Blue d6)
            defenceIcons.forEach(icon => spawnD6(icon));
        }

        function animate3D() {
            requestAnimationFrame(animate3D);
            world.step(1 / 60);

            for (let i = 0; i < diceBodies.length; i++) {
                diceMeshes[i].position.copy(diceBodies[i].position);
                diceMeshes[i].quaternion.copy(diceBodies[i].quaternion);
            }

            renderer.render(scene, camera);
        }

        function closeDiceTray() {
            document.getElementById('diceTrayContainer').classList.add('hidden');
            document.getElementById('diceTrayContainer').classList.remove('flex');
        }
    </script>
</body>
