<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setup - Solo Shatterpoint</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="./style.css" rel="stylesheet">
</head>

<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased p-4 md:p-8">
    <script type="text/javascript" src="util.js"></script>

    <datalist id="primaryDatalist"></datalist>
    <datalist id="secondaryDatalist"></datalist>
    <datalist id="supportDatalist"></datalist>
    <datalist id="locationDatalist"></datalist>
    <datalist id="factionDatalist"></datalist>
    <datalist id="enemyDatalist"></datalist>

    <main class="max-w-4xl mx-auto space-y-6">
        <!-- Header & Navigation -->
        <header
            class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 pb-4 border-b border-slate-800">
            <div>
                <h1 class="text-2xl font-bold tracking-tight text-white">Solo Shatterpoint Setup</h1>
                <p class="text-xs text-slate-400 mt-1">Configure your strike teams, location, and enemies before
                    initiating game mode.</p>
            </div>
            <div class="flex items-center gap-3 text-xs">
                <a target="_blank" rel="noopener noreferrer" href="./rules.html"
                    class="px-3 py-1.5 bg-slate-900 hover:bg-slate-800 text-slate-300 rounded-md border border-slate-800 transition">Special
                    Rules ↗</a>
                <a target="_blank" rel="noopener noreferrer" href="./chars.html"
                    class="px-3 py-1.5 bg-slate-900 hover:bg-slate-800 text-slate-300 rounded-md border border-slate-800 transition">Characters
                    ↗</a>
                <a target="_blank" rel="noopener noreferrer" href="./locations.html"
                    class="px-3 py-1.5 bg-slate-900 hover:bg-slate-800 text-slate-300 rounded-md border border-slate-800 transition">Locations
                    ↗</a>
                <a target="_blank" rel="noopener noreferrer" href="./enemies.html"
                    class="px-3 py-1.5 bg-slate-900 hover:bg-slate-800 text-slate-300 rounded-md border border-slate-800 transition">Enemies
                    ↗</a>
            </div>
        </header>

        <!-- Mode Selector -->
        <section
            class="bg-slate-900/60 border border-slate-800 rounded-xl p-4 flex items-center justify-between flex-wrap gap-4">
            <div class="flex items-center gap-4 text-xs font-semibold">
                <span class="text-slate-400 uppercase tracking-wider">Format:</span>
                <label for="strikeTeam"
                    class="cursor-pointer flex items-center gap-2 bg-slate-950 px-3 py-2 rounded-lg border border-slate-800 hover:border-slate-700">
                    <input type="radio" id="strikeTeam" name="group" checked class="accent-indigo-500">
                    <span>Strike Team (3 Characters)</span>
                </label>
                <label for="squad"
                    class="cursor-pointer flex items-center gap-2 bg-slate-950 px-3 py-2 rounded-lg border border-slate-800 hover:border-slate-700">
                    <input type="radio" id="squad" name="group" class="accent-indigo-500">
                    <span>Squad (2 Strike Teams)</span>
                </label>
            </div>
            <div
                class="flex items-center gap-2 bg-slate-950 px-3 py-2 rounded-lg border border-slate-800 text-xs font-mono">
                <span class="text-slate-400">Total Force Pool:</span>
                <span id="forcePool" class="font-bold text-indigo-400">0</span>
                <span style="font-family: shatterpoint_icons">v</span>
            </div>
        </section>

        <!-- Strike Teams -->
        <section class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- Strike Team 1 -->
            <div class="bg-slate-900/40 border border-slate-800 rounded-xl p-4 space-y-3">
                <h2 class="text-sm font-bold text-slate-200 border-b border-slate-800 pb-2">Strike Team 1</h2>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Primary Character</label>
                    <input type="text" id="s1Primary" list="primaryDatalist" placeholder="Select Primary Character"
                        class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs focus:outline-none focus:border-indigo-500 transition">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Secondary Character</label>
                    <input type="text" id="s1Secondary" list="secondaryDatalist"
                        placeholder="Select Secondary Character"
                        class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs focus:outline-none focus:border-indigo-500 transition">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Supporting Character</label>
                    <input type="text" id="s1Support" list="supportDatalist" placeholder="Select Supporting Character"
                        class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs focus:outline-none focus:border-indigo-500 transition">
                </div>
            </div>

            <!-- Strike Team 2 -->
            <div id="secondStrikeTeam" class="bg-slate-900/40 border border-slate-800 rounded-xl p-4 space-y-3 hidden">
                <h2 class="text-sm font-bold text-slate-200 border-b border-slate-800 pb-2">Strike Team 2</h2>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Primary Character</label>
                    <input type="text" id="s2Primary" list="primaryDatalist" placeholder="Select Primary Character"
                        class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs focus:outline-none focus:border-indigo-500 transition">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Secondary Character</label>
                    <input type="text" id="s2Secondary" list="secondaryDatalist"
                        placeholder="Select Secondary Character"
                        class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs focus:outline-none focus:border-indigo-500 transition">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Supporting Character</label>
                    <input type="text" id="s2Support" list="supportDatalist" placeholder="Select Supporting Character"
                        class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs focus:outline-none focus:border-indigo-500 transition">
                </div>
            </div>
        </section>

        <!-- Mission & Enemy Settings -->
        <section class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- Location & Faction -->
            <div class="bg-slate-900/40 border border-slate-800 rounded-xl p-4 space-y-3">
                <h2 class="text-sm font-bold text-slate-200 border-b border-slate-800 pb-2">Location & Factions</h2>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Location</label>
                    <input type="text" id="location" list="locationDatalist" placeholder="Select Location"
                        class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs focus:outline-none focus:border-indigo-500 transition">
                </div>
                <div id="factionSelector" class="space-y-3 hidden">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Player Faction</label>
                        <input type="text" id="faction" list="factionDatalist" placeholder="Select Allied Faction"
                            class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs focus:outline-none focus:border-indigo-500 transition">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Enemy Faction</label>
                        <input type="text" id="enemyFaction" list="factionDatalist" placeholder="Select Enemy Faction"
                            class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs focus:outline-none focus:border-indigo-500 transition">
                    </div>
                </div>
            </div>

            <!-- Enemies & Game Parameters -->
            <div class="bg-slate-900/40 border border-slate-800 rounded-xl p-4 space-y-3">
                <h2 class="text-sm font-bold text-slate-200 border-b border-slate-800 pb-2">Enemies & Setup</h2>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Enemy Primary Unit</label>
                    <input type="text" id="enemy" list="enemyDatalist" placeholder="Select Enemy Unit"
                        class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs focus:outline-none focus:border-indigo-500 transition">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Total Strike Teams
                            (Difficulty)</label>
                        <input type="number" id="difficulty" placeholder="1" value="1" min="1"
                            class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs focus:outline-none focus:border-indigo-500 transition">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Number of Missions</label>
                        <input type="number" id="missions" placeholder="1" min="1" value="1"
                            class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-xs focus:outline-none focus:border-indigo-500 transition">
                    </div>
                </div>
            </div>
        </section>

        <!-- Actions & Error Logs -->
        <footer class="space-y-3 pt-2">
            <button onclick="play()"
                class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 font-bold text-white rounded-xl shadow-lg shadow-indigo-600/20 transition cursor-pointer">
                Start Game
            </button>
            <div id="errorLog" class="text-xs text-rose-400 font-medium text-center empty:hidden"></div>
        </footer>
    </main>

    <script>
        withUnits((data) => {
            var primaries = "";
            var secondaries = "";
            var supporting = "";
            Object.values(data).forEach((unit) => {
                if (unit["hidden"]) return;
                if (!unit.hasOwnProperty("abilities")) return;
                var option = `<option value="${unit["name"]}"></option>`;
                if (unit["count"] > 1) {
                    supporting += option;
                } else {
                    if (unit["abilities"].hasOwnProperty("primary")) {
                        primaries += option;
                    }
                    if (unit["abilities"].hasOwnProperty("secondary")) {
                        secondaries += option;
                        supporting += option;
                    }
                }
            });
            document.getElementById("primaryDatalist").innerHTML = primaries;
            document.getElementById("secondaryDatalist").innerHTML = secondaries;
            document.getElementById("supportDatalist").innerHTML = supporting;
        });

        withLocations((data) => {
            document.getElementById("locationDatalist").innerHTML = Object.keys(data).map((key) => `<option value="${key}"></option>`).join("");
        });

        document.getElementById("location").addEventListener('change', (event) => {
            var value = event.target.value;
            var factionSelector = document.getElementById("factionSelector");
            if (value === '' || !LOCATIONS.hasOwnProperty(value)) {
                document.getElementById("factionDatalist").innerHTML = '';
                factionSelector.classList.add('hidden');
                factionSelector.value = "";
            } else {
                document.getElementById("factionDatalist").innerHTML = Object.keys(LOCATIONS[value]["factions"]).map((faction) => `<option value="${faction}"></option>`).join("");
                factionSelector.classList.remove('hidden');
                factionSelector.value = "";
            }
        });

        withEnemies((data) => {
            document.getElementById("enemyDatalist").innerHTML = Object.entries(data).filter(([key, unit]) => unit["deck"]["cards"].length > 0).map(([key, unit]) => `<option value="${key}"></option>`).join("");
        });

        document.getElementById("strikeTeam").addEventListener('change', function () {
            document.getElementById("secondStrikeTeam").classList.add('hidden');
            calcForce();
        });
        document.getElementById("squad").addEventListener('change', function () {
            document.getElementById("secondStrikeTeam").classList.remove('hidden');
            calcForce();
        });

        document.getElementById("s1Primary").addEventListener('change', function () { calcForce() });
        document.getElementById("s1Secondary").addEventListener('change', function () { calcForce() });
        document.getElementById("s2Primary").addEventListener('change', function () { calcForce() });

        function calcForce() {
            if (document.getElementById("squad").checked) {
                document.getElementById("forcePool").innerText = getForce(document.getElementById("s1Primary").value) + getForce(document.getElementById("s2Primary").value);
            } else {
                document.getElementById("forcePool").innerText = getForce(document.getElementById("s1Primary").value) + Math.ceil(getForce(document.getElementById("s1Secondary").value) / 2);
            }
        }

        function getForce(unit) {
            if (unit === '' || !UNITS.hasOwnProperty(unit))
                return 0;
            return UNITS[unit]["force"];
        }

        function play() {
            var errorLog = document.getElementById("errorLog");
            errorLog.innerText = "";

            var primary = document.getElementById("s1Primary").value;
            var secondary = document.getElementById("s1Secondary").value;
            var supporting = document.getElementById("s1Support").value;
            if (primary === '' && secondary === '' && supporting === '') {
                errorLog.innerText = "ERROR: Please specify at least one valid character to play as!";
                return;
            }
            var strike1 = `p=${primary}&se=${secondary}&su=${supporting}`;
            var strike2 = "";
            if (document.getElementById("squad").checked) {
                var primary = document.getElementById("s2Primary").value;
                var secondary = document.getElementById("s2Secondary").value;
                var supporting = document.getElementById("s2Support").value;
                strike2 = `&p2=${primary}&se2=${secondary}&su2=${supporting}`;
            }

            var location = document.getElementById("location").value;
            var faction = document.getElementById("faction").value;
            var enemyFaction = document.getElementById("enemyFaction").value;
            if (enemyFaction !== '' && LOCATIONS[location] && LOCATIONS[location]["factions"].hasOwnProperty(enemyFaction)) {
                enemyFaction = `&enemyFaction=${enemyFaction}`;
            }

            var enemies = document.getElementById("enemy").value;

            var difficulty = document.getElementById("difficulty").value;
            if (!difficulty)
                difficulty = 0;

            var missions = document.getElementById("missions").value;
            if (!missions)
                missions = 1;

            window.open(`./emu.html?${strike1}${strike2}&force=${document.getElementById("forcePool").innerText}&location=${location}&faction=${faction}&enemies=${enemies}${enemyFaction}&difficulty=${difficulty}&missions=${missions}`, "_blank");
        }
    </script>
</body>

</html>
